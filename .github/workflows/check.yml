name: Public examples
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['20', '22']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: syntax check
        run: node tools/check-syntax.mjs
      - name: vendored copy check
        run: node tools/sync-dsh-core.mjs --check
      - name: tests
        run: node tools/run-tests.mjs
      # 与 npm run check 同一道闸（S12 收尾）：负例误召回、封存/抽屉外露、标记外露，以及
      # eval/thresholds-v2.json 里的回归地板。所有矩阵组合都跑（不贵，452 条用例）。
      # 不用在这里额外模拟"没有 node:sqlite"：Node 20 根本没有（要 >= 22.5），44 条 sqlite 用例
      # 自己 skip；Node 22 由 setup-node 装到 22.13+，node:sqlite 默认可用，那些用例照跑。
      # 也就是说这两个 node 版本合起来正好把「有 sqlite / 没 sqlite」两条路都覆盖了。
      - name: eval-v2 gate (boundaries / regression floor)
        run: node tools/eval-v2.mjs --check
      # 护栏的白名单要经得起「仓库本身在 /tmp 下」：把仓库复制到 /tmp 再跑一遍测试。
      # 之前那条会把 package.json 当临时文件删掉，正是缺了这一步。
      - name: tests from a /tmp checkout
        if: matrix.os == 'ubuntu-latest' && matrix.node == '22'
        run: |
          cp -R . /tmp/whale-shadow
          cd /tmp/whale-shadow
          node tools/run-tests.mjs
      - name: privacy canary
        run: node tools/privacy-canary.mjs
      - name: recall eval
        run: node tools/eval-recall.mjs
      # 两道硬闸：封存/抽屉不许外露、then 逐字节不可变；跑的是与 npm run check 同一条命令
      - name: whale-eval gates (seal leaks / then immutability)
        run: node tools/whale-eval.mjs --check
      - name: type declarations
        if: matrix.os == 'ubuntu-latest' && matrix.node == '22'
        run: npm run types