name: Public examples
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['20', '22']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: syntax check
        run: node tools/check-syntax.mjs
      - name: tests
        run: node tools/run-tests.mjs
      - name: privacy canary
        run: node tools/privacy-canary.mjs
      - name: recall eval
        run: node tools/eval-recall.mjs