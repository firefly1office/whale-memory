name: publish-core

# 用 npm trusted publishing（OIDC）发布 whale-memory-core。
# 不需要 NPM_TOKEN，也不需要验证码：GitHub 直接向 npm 证明这次发布来自这个仓库。
on:
  workflow_dispatch:
  push:
    tags:
      - 'core-v*'

permissions:
  contents: read
  id-token: write   # OIDC 必须有

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: 版本与包名自检
        working-directory: packages/core
        run: |
          node -e "const p=require('./package.json');console.log('package:',p.name,'version:',p.version)"
          test "$(node -p "require('./package.json').name")" = "whale-memory-core"

      - name: 发布（带 provenance）
        working-directory: packages/core
        run: npm publish --provenance --access public