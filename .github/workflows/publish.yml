name: publish

# 用 npm trusted publishing（OIDC）发布包。
# 不需要 NPM_TOKEN，也不需要验证码：GitHub 直接向 npm 证明这次发布来自这个仓库。
#
# 三个包共用一个 matrix 作业：闸门（check / 类型 / 包名 / tag-version / 版本已存在）
# 只写一遍，加包就是加一行 matrix。
on:
  workflow_dispatch:
  push:
    tags:
      - 'core-v*'
      - 'emotion-v*'
      - 'drafts-v*'

permissions:
  contents: read
  id-token: write   # OIDC 必须有

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: whale-memory-core
            dir: packages/core
            prefix: core-v
          - name: whale-emotion-intake
            dir: packages/emotion-intake
            prefix: emotion-v
          - name: whale-drafts
            dir: packages/drafts
            prefix: drafts-v
    # 手动触发会跑全部；tag 触发只跑前缀对上的那个
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, format('refs/tags/{0}', matrix.prefix))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # 发布前先过硬闸：语法、测试、封存外露 / then 不可变、类型声明；不过就不发
      - name: 发布前自检（测试 / check）
        run: npm run check

      - name: 发布前类型冒烟
        run: npm run types

      - name: 包名自检
        working-directory: ${{ matrix.dir }}
        run: |
          node -e "const p=require('./package.json');console.log('package:',p.name,'version:',p.version)"
          test "$(node -p "require('./package.json').name")" = "${{ matrix.name }}"
          test "$(node -p "require('./package.json').private || false")" = "false"

      # 闸门：tag 必须和包里的版本号一致，否则打错 tag 也会把旧版本发成 latest
      - name: tag 与 version 对齐
        if: startsWith(github.ref, format('refs/tags/{0}', matrix.prefix))
        working-directory: ${{ matrix.dir }}
        run: |
          want="$(node -p "require('./package.json').version")"
          got="${GITHUB_REF_NAME#${{ matrix.prefix }}}"
          echo "tag=$GITHUB_REF_NAME package=$want"
          test "$want" = "$got"

      # 闸门：注册表上已有同版本就别等 403，提前失败并说清楚
      - name: 注册表是否已有这个版本
        working-directory: ${{ matrix.dir }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if npm view "${{ matrix.name }}@${version}" version >/dev/null 2>&1; then
            echo "::error::${{ matrix.name }}@${version} 已经发布过了；改版本号再打 tag，或确认要不要重发。"
            exit 1
          fi
          echo "${{ matrix.name }}@${version} 尚未发布，可以继续"

      - name: 发布（带 provenance）
        working-directory: ${{ matrix.dir }}
        run: npm publish --provenance --access public